<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Asset Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Samarkan';
            src: url('https://db.onlinewebfonts.com/t/8107f8b787a40a84fbf3ee220abd84aa.woff2') format('woff2');
        }

        body {
            font-family: sans-serif;
            padding: 20px;
            background: #333;
            color: white;
        }

        canvas {
            border: 1px solid #777;
            margin: 10px;
            background: #FFFDF5;
        }
    </style>
</head>

<body>
    <div style="position:absolute; left:-9999px; top:-9999px; visibility:hidden;">
        <span style="font-family:'Khand'; font-weight:400;">Khand 400</span>
        <span style="font-family:'Khand'; font-weight:500;">Khand 500</span>
        <span style="font-family:'Khand'; font-weight:600;">Khand 600</span>
        <span style="font-family:'Khand'; font-weight:700;">Khand 700</span>
        <span style="font-family:'Libre Baskerville'; font-weight:400;">Libre 400</span>
        <span style="font-family:'Libre Baskerville'; font-weight:700;">Libre 700</span>
    </div>
    <h2>Generating email assets...</h2>
    <div id="status">Loading fonts...</div>
    <div id="canvases"></div>

    <script>
        async function run() {
            const status = document.getElementById('status');
            try {
                const font = new FontFace('Samarkan', 'url(https://db.onlinewebfonts.com/t/8107f8b787a40a84fbf3ee220abd84aa.woff2)');
                await Promise.race([font.load(), new Promise(r => setTimeout(r, 2000))]);
                document.fonts.add(font);
            } catch (e) {
                console.warn('Samarkan load timeout/error, using fallback', e);
            }

            // Wait for all Google fonts
            await document.fonts.ready;
            await Promise.all([
                document.fonts.load('500 32px Khand'),
                document.fonts.load('600 32px Khand'),
                document.fonts.load('700 32px Khand'),
                document.fonts.load('700 38px Khand'),
                document.fonts.load('700 54px Khand'),
                document.fonts.load('700 28px Khand'),
                document.fonts.load('italic 500 25px Khand'),
                document.fonts.load('700 27px Khand'),

                const canvas = document.createElement('canvas');
                canvas.width = 680;
                canvas.height = 160;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.font = 'bold 110px "Samarkan", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                // Soft background glow / outer shadow
                ctx.fillStyle = 'rgba(177, 8, 34, 0.12)';
                ctx.fillText("Saavan '26", cx + 8, cy + 9);

                // Gold 3D shadow layer
                ctx.fillStyle = 'rgba(255, 191, 0, 0.9)';
                ctx.fillText("Saavan '26", cx + 4, cy + 5);

                // Main deep red text
                ctx.fillStyle = '#B10822';
                ctx.fillText("Saavan '26", cx, cy);

                document.getElementById('canvases').appendChild(canvas);
                results['saavan26_title.png'] = canvas.toDataURL('image/png');
            }

                    ctx.fillRect(0, y, 64, 1.5);

                    ctx.fillRect(x, 0, 1.5, 64);
                }
                // Diagonal gold/crimson twill

                    ctx.strokeStyle = 'rgba(177, 8, 34, 0.28)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(d, 0);
                    ctx.lineTo(d + 64, 64);
                    ctx.stroke();

                    ctx.strokeStyle = 'rgba(60, 0, 10, 0.22)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(d + 64, 0);

            // Helper for wrapping text cleanly
            function wrapTextHelper(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                let currentY = y;
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + (line ? ' ' : '') + words[n];
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        line = words[n];
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                if (line) {
                    ctx.fillText(line, x, currentY);
                    currentY += lineHeight;
                }
                return currentY;
            }

                mattingGrad.addColorStop(1, '#021530');

                outerGoldGrad.addColorStop(0.0, '#FFF6C2');
                outerGoldGrad.addColorStop(0.18, '#D8A000');
                outerGoldGrad.addColorStop(0.45, '#FFD54F');
                outerGoldGrad.addColorStop(0.70, '#8A6000');
                outerGoldGrad.addColorStop(0.88, '#FFDF73');

                ctx.strokeStyle = innerGoldGrad;

                        const qy = queue[head++];

                        const neighbors = [
                            [qx + 1, qy], [qx - 1, qy], [qx, qy + 1], [qx, qy - 1]
                        ];

                        for (let n = 0; n < neighbors.length; n++) {
                            const nx = neighbors[n][0];
                            const ny = neighbors[n][1];
                            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                const idx = ny * w + nx;
                                if (mask[idx] === 0) {
                                    const pIdx = idx * 4;
                                    const r = data[pIdx];
                                    const g = data[pIdx + 1];
                                    const b = data[pIdx + 2];

                                    if (isRedBg(r, g, b)) {
                                        mask[idx] = 1;
                                        queue.push(nx, ny);
                                    } else {
                                        mask[idx] = 2; // Letter boundary
                                    }
                                }
                            }
                        }
                    }

                    // Also check inner enclosed holes (e.g. between letters)
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const idx = y * w + x;
                            if (mask[idx] === 0) {
                                const pIdx = idx * 4;
                                const r = data[pIdx];
                                const g = data[pIdx + 1];
                                const b = data[pIdx + 2];
                                if (isRedBg(r, g, b)) {
                                    // Run mini flood fill
                                    const localQ = [x, y];
                                    mask[idx] = 1;
                                    let lHead = 0;
                                    while (lHead < localQ.length) {
                                        const lx = localQ[lHead++];
                                        const ly = localQ[lHead++];
                                        const lNeighbors = [[lx + 1, ly], [lx - 1, ly], [lx, ly + 1], [lx, ly - 1]];
                                        for (let k = 0; k < lNeighbors.length; k++) {
                                            const kx = lNeighbors[k][0];
                                            const ky = lNeighbors[k][1];
                                            if (kx >= 0 && kx < w && ky >= 0 && ky < h) {
                                                const kIdx = ky * w + kx;
                                                if (mask[kIdx] === 0) {
                                                    const kpIdx = kIdx * 4;
                                                    if (isRedBg(data[kpIdx], data[kpIdx + 1], data[kpIdx + 2])) {
                                                        mask[kIdx] = 1;
                                                        localQ.push(kx, ky);
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // Apply transparency and smooth anti-aliased edge
                    for (let i = 0; i < w * h; i++) {
                        if (mask[i] === 1) {
                            data[i * 4 + 3] = 0; // Fully transparent
                        }
                    }

                    // Feather edges: 1px border smoothing
                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const idx = y * w + x;
                            if (mask[idx] !== 1) {
                                // Check if neighbor is transparent
                                const hasTransparentNeighbor =
                                    mask[idx - 1] === 1 || mask[idx + 1] === 1 ||
                                    mask[idx - w] === 1 || mask[idx + w] === 1;

                                if (hasTransparentNeighbor) {
                                    const pIdx = idx * 4;
                                    // If this border pixel is reddish, neutralize/feather it
                                    if (data[pIdx] > data[pIdx + 1] * 1.5 && data[pIdx + 1] < 70) {
                                        data[pIdx + 3] = Math.max(0, Math.min(255, data[pIdx + 3] - 120));
                                    }
                                }
                            }
                        }

                    ctx.roundRect(0, y, cardW, cardH, cRadius);

                    ctx.beginPath();
                    ctx.roundRect(0, y, cardW, cardH, cRadius);

                    ctx.restore();

                    y += cardH + cardGap;
